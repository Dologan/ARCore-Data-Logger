// Top-level build file. See settings.gradle for plugin and dependency repositories.
//
// The Sceneform Gradle plugin (com.google.ar.sceneform:plugin) has been removed: it only ever
// existed to compile .sfa/.sfb model assets, this project has none, and it does not work with
// modern AGP. The sceneform-ux *runtime* dependency is unaffected and still used.
plugins {
    id 'com.android.application' version '9.4.0' apply false
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
