org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=false

# Sceneform 1.11.0 is a 2019 artifact that still depends on com.android.support:support-compat,
# whose classes collide with androidx.core. Jetifier rewrites those references to AndroidX at
# build time. This is the last thing keeping the archived Sceneform runtime viable here, and is
# a large part of why UannaScan moves to SceneView instead of carrying this forward.
android.enableJetifier=true

# Sceneform 1.11.0 ships two artifacts (core, sceneform-base) declaring the same
# namespace, which AGP 8+ rejects. The library was archived in 2020 and will never be fixed.
android.uniquePackageNames=false
