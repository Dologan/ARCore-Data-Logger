apply plugin: 'com.android.application'

android {
    namespace 'com.pjinkim.arcore_data_logger'
    compileSdk 37

    defaultConfig {
        applicationId "com.pjinkim.arcore_data_logger"
        minSdkVersion 26
        // Deliberately held at 34: targetSdk is an opt-in to runtime restrictions, and this is a
        // sideloaded research tool, not a Play Store app. See UannaScan docs/compatibility.md.
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    // Signing is optional; without a keystore the release build is simply unsigned.
    signingConfigs {
        release {
            def keystorePath = System.getenv("UANNASCAN_KEYSTORE")
            if (keystorePath != null && !keystorePath.isEmpty() && file(keystorePath).exists()) {
                storeFile file(keystorePath)
                storePassword System.getenv("UANNASCAN_KEYSTORE_PASSWORD")
                keyAlias System.getenv("UANNASCAN_KEY_ALIAS")
                keyPassword System.getenv("UANNASCAN_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    lint {
        // Nothing above minSdk may be called unguarded.
        error.add('NewApi')
        abortOnError = true
    }
}

dependencies {
    implementation "com.google.ar.sceneform.ux:sceneform-ux:1.11.0"
    // Sceneform 1.11 pulls a 2019 ARCore; pin the current one explicitly.
    implementation "com.google.ar:core:1.56.0"
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
